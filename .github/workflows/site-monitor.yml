name: Site monitor

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  site-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare config
        run: |
          if [ ! -f config/site-monitor.json ]; then
            cp config/site-monitor.example.json config/site-monitor.json
          fi
          mkdir -p /tmp/site-monitor-state /tmp/site-monitor-reports

      - name: Run site monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SITE_MONITOR_STATE_DIR: /tmp/site-monitor-state
          SITE_MONITOR_REPORT_DIR: /tmp/site-monitor-reports
        run: node scripts/site-monitor.mjs

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-monitor-report
          path: /tmp/site-monitor-reports/
          if-no-files-found: error
